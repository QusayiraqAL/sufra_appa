name: sufra
description: "سُفرة — تطبيق إدارة المنيو الرقمي والطلبات لأصحاب المطاعم."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة
  provider: ^6.1.5+1

  # التخزين المحلي — البيانات على الجهاز كما في النموذج المبدئي للموقع
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # رموز QR والطباعة والمشاركة
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.0

  # الصور والملفات
  image_picker: ^1.2.3
  file_picker: ^13.1.0

  # أدوات النظام
  url_launcher: ^6.3.2
  audioplayers: ^6.7.1
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/

  # خطوط الموقع نفسها، مضمّنة في التطبيق حتى يعمل بلا إنترنت:
  # Tajawal للعناوين، IBM Plex Sans Arabic للنصوص، Amiri للمنيو الورقي.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#18201A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
